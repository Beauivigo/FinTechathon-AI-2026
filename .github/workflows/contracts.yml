name: Project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    # Native credential encryption is intentionally backed by Windows DPAPI.
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install page dependency
        run: python -m pip install -r requirements-app.txt -r requirements-materials.txt
      - name: Require page test dependency
        run: python -c "from streamlit.testing.v1 import AppTest"
      - name: Validate contracts, examples and page interactions
        run: python -m unittest discover -s tests -v
      - name: Validate Windows installer tooling
        if: matrix.python-version != '3.10'
        run: python -m unittest win_installer.test_installer win_installer.test_runtime_paths -v
      - name: Run integration example
        run: python -X utf8 -m examples.contract_demo
      - name: Run persistent gateway and funds examples
        run: |
          python -X utf8 -m examples.gateway_demo
          python -X utf8 -m examples.funds_demo
          python -X utf8 -m examples.billing_demo
