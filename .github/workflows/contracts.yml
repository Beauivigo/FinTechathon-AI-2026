name: Project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install first-round page dependency
        run: python -m pip install -r requirements-app.txt
      - name: Require page test dependency
        run: python -c "from streamlit.testing.v1 import AppTest"
      - name: Validate contracts, examples and page interactions
        run: python -m unittest discover -s tests -v
      - name: Run integration example
        run: python -X utf8 -m examples.contract_demo
