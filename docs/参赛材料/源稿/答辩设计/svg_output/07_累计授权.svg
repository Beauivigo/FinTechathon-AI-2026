<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDFFC2" stop-opacity="0.45"/><stop offset="0.5" stop-color="#F8FBFA"/><stop offset="1" stop-color="#EEE1FF" stop-opacity="0.6"/></linearGradient></defs>
<rect id="p07-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#field)"/>
<g id="p07-heading" data-pptx-bounds="64 34 1152 118" fill="#183B3A"><text x="64" y="56" font-size="14" fill="#466460">01　可信技术 / 动态授权</text><text x="64" y="124" font-size="44" font-weight="bold">转账授权，看含本笔的当日累计</text></g>
<g id="p07-green" data-pptx-bounds="64 188 352 328" fill="#183B3A"><rect x="64" y="192" width="352" height="320" rx="24" fill="#FFFFFF"/><text x="96" y="240" font-size="20" fill="#247657">绿色 · 执行</text><text x="96" y="300" font-size="28" font-weight="bold">查询与只读</text><text x="96" y="354">余额、流水、账单<tspan x="96" dy="36">产品对比、日期计划</tspan></text><text x="96" y="454" font-size="20" fill="#466460">仍校验输入与资源归属。</text></g>
<g id="p07-yellow" data-pptx-bounds="464 188 352 328" fill="#183B3A"><rect x="464" y="192" width="352" height="320" rx="24" fill="#FFFFD0"/><text x="496" y="240" font-size="20" fill="#7A5B12">黄色 · 明确确认</text><text x="496" y="300" font-size="28" font-weight="bold">累计 ≤ 1000 元</text><text x="496" y="354">符合门槛的转账<tspan x="496" dy="36">AA 建单、卡片申请</tspan><tspan x="496" dy="36">订阅查看、取消、提醒</tspan></text><text x="496" y="474" font-size="20" fill="#466460">先展示对象和参数。</text></g>
<g id="p07-red" data-pptx-bounds="864 188 352 328" fill="#183B3A"><rect x="864" y="192" width="352" height="320" rx="24" fill="#FFEAE1"/><text x="896" y="240" font-size="20" fill="#A64153">红色 · 强验证</text><text x="896" y="300" font-size="28" font-weight="bold">累计 &gt; 1000 元</text><text x="896" y="354">超门槛转账、申赎<tspan x="896" dy="36">卡状态及限额变更</tspan><tspan x="896" dy="36">订单、每期订阅续费</tspan></text><text x="896" y="474" font-size="20" fill="#466460">验证绑定本次操作。</text></g>
<g id="p07-rule-and-proof" data-pptx-bounds="64 548 1152 102" fill="#183B3A"><text x="64" y="582">同一用户跨账户，<tspan font-weight="bold" fill="#21605F">已付累计含本笔</tspan>，按上海执行日计算；到期和执行时复验。</text><text x="64" y="630" font-size="20" fill="#466460">本机账号用 TOTP；示例体验用模拟验证。挑战 10 分钟有效，错误证明累计 5 次锁定。</text></g>
<g id="p07-footer" data-pptx-role="footer" data-pptx-bounds="64 660 1152 38" font-size="14" fill="#466460"><text x="64" y="688">阈值只用于转账动态分级；其他动作依各自既定策略。</text><text x="1216" y="688" text-anchor="end">07 / 24</text></g>
</svg>
