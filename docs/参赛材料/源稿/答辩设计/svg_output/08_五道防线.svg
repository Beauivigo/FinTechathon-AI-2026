<g id="p08-heading" data-pptx-bounds="64 34 1152 118" fill="#183B3A"><text x="64" y="56" font-size="14" fill="#466460">01　可信技术 / 安全自评</text><text x="64" y="124" font-size="44" font-weight="bold">五道防线，每层都有可检查的约束</text></g>
<g id="p08-identity" data-pptx-bounds="64 200 208 358" fill="#183B3A"><rect x="64" y="204" width="208" height="348" rx="24" fill="#FFFFFF"/><text x="92" y="252" font-size="28" fill="#21605F">01</text><text x="92" y="316" font-size="28" font-weight="bold">身份</text><text x="92" y="372">scrypt<tspan x="92" dy="36">密码、TOTP</tspan><tspan x="92" dy="36">恢复码</tspan></text><text x="92" y="516" font-size="20" fill="#466460">恢复不批付款</text></g>
<g id="p08-authorization" data-pptx-bounds="300 200 208 358" fill="#183B3A"><rect x="300" y="204" width="208" height="348" rx="24" fill="#FFFFD0" fill-opacity="0.75"/><text x="328" y="252" font-size="28" fill="#21605F">02</text><text x="328" y="316" font-size="28" font-weight="bold">授权</text><text x="328" y="372">绿黄红分级<tspan x="328" dy="36">执行时复验</tspan><tspan x="328" dy="36">限时挑战</tspan></text><text x="328" y="516" font-size="20" fill="#466460">授权属于本次</text></g>
