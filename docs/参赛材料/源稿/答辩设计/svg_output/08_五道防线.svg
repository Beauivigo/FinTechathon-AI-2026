<g id="p08-funds" data-pptx-bounds="772 200 208 358" fill="#183B3A"><rect x="772" y="204" width="208" height="348" rx="24" fill="#FFFFFF"/><text x="800" y="252" font-size="28" fill="#21605F">04</text><text x="800" y="316" font-size="28" font-weight="bold">资金</text><text x="800" y="372">整数分、事务<tspan x="800" dy="36">幂等键</tspan><tspan x="800" dy="36">unknown</tspan><tspan x="800" dy="36">先查原操作</tspan></text><text x="800" y="516" font-size="20" fill="#466460">不换新键重付</text></g>
