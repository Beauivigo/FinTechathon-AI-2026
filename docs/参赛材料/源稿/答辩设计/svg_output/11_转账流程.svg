<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFD0" stop-opacity="0.6"/><stop offset="0.48" stop-color="#F8FBFA"/><stop offset="1" stop-color="#D8EFFF" stop-opacity="0.65"/></linearGradient></defs>
<rect id="p11-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#field)"/>
<g id="p11-heading" data-pptx-bounds="64 34 1152 118" fill="#183B3A"><text x="64" y="56" font-size="14" fill="#466460">02　业务与资金 / 转账</text><text x="64" y="124" font-size="44" font-weight="bold">先把人认对，再把钱转对</text></g>
<g id="p11-transfer-path" data-pptx-bounds="100 186 1080 146" fill="#183B3A"><line x1="154" y1="224" x2="1124" y2="224" stroke="#D5E5E0" stroke-width="3"/><g id="p11-path-stations" text-anchor="middle"><circle cx="154" cy="224" r="24" fill="#FFFFFF"/><circle cx="348" cy="224" r="24" fill="#FFFFFF"/><circle cx="542" cy="224" r="24" fill="#DDFFC2"/><circle cx="736" cy="224" r="24" fill="#FFFFD0"/><circle cx="930" cy="224" r="24" fill="#D8EFFF"/><circle cx="1124" cy="224" r="24" fill="#FFEAE1"/><g id="p11-path-numbers" font-size="20"><text x="154" y="232">01</text><text x="348" y="232">02</text><text x="542" y="232">03</text><text x="736" y="232">04</text><text x="930" y="232">05</text><text x="1124" y="232">06</text></g><g id="p11-path-labels" font-size="28" font-weight="bold"><text x="154" y="300">识别</text><text x="348" y="300">消歧</text><text x="542" y="300">确认</text><text x="736" y="300">授权</text><text x="930" y="300">执行</text><text x="1124" y="300">回执</text></g></g></g>
<g id="p11-direct" data-pptx-bounds="64 364 352 166" fill="#183B3A"><rect x="64" y="368" width="352" height="156" rx="24" fill="#FFFFFF"/><text x="96" y="414" font-size="28" font-weight="bold">单笔转账</text><text x="96" y="462">核对金额、账户和收款人；<tspan x="96" dy="36">按含本笔当日累计授权。</tspan></text></g>
<g id="p11-scheduled" data-pptx-bounds="464 364 352 166" fill="#183B3A"><rect x="464" y="368" width="352" height="156" rx="24" fill="#D8EFFF" fill-opacity="0.7"/><text x="496" y="414" font-size="28" font-weight="bold">定时转账</text><text x="496" y="462">登记不是永久授权；<tspan x="496" dy="36">到期重新计算要求。</tspan></text></g>
<g id="p11-split" data-pptx-bounds="864 364 352 166" fill="#183B3A"><rect x="864" y="368" width="352" height="156" rx="24" fill="#FFFFFF"/><text x="896" y="414" font-size="28" font-weight="bold">AA 收款</text><text x="896" y="462">建单不等于收齐；<tspan x="896" dy="36">每笔付款仍需授权。</tspan></text></g>
<g id="p11-execution-checks" data-pptx-bounds="64 556 1152 94" fill="#183B3A"><text x="64" y="588">执行前复验：卡状态、单笔限额、账户绑定、同用户当日累计。</text><text x="64" y="632">unknown 先查询原操作；<tspan font-weight="bold" fill="#21605F">NOT_FOUND</tspan> 不能推定未扣款。</text></g>
<g id="p11-footer" data-pptx-role="footer" data-pptx-bounds="64 660 1152 38" font-size="14" fill="#466460"><text x="64" y="688">状态、回执与幂等键共同保留业务事实。</text><text x="1216" y="688" text-anchor="end">11 / 24</text></g>
</svg>
