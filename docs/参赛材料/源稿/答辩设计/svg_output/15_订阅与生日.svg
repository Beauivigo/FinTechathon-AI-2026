<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFEAE1" stop-opacity="0.65"/><stop offset="0.48" stop-color="#F8FBFA"/><stop offset="1" stop-color="#B6FAFF" stop-opacity="0.7"/></linearGradient></defs>
<rect id="p15-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#field)"/>
<g id="p15-heading" data-pptx-bounds="64 34 1152 118" fill="#183B3A"><text x="64" y="56" font-size="14" fill="#466460">02　业务与资金 / 订阅与生日</text><text x="64" y="124" font-size="44" font-weight="bold">把“以后”变成可撤销的计划</text></g>
<g id="p15-subscription-lane" data-pptx-bounds="64 188 552 454" fill="#183B3A"><rect x="64" y="192" width="552" height="444" rx="24" fill="#FFFFFF" fill-opacity="0.8"/><text x="96" y="242" font-size="28" font-weight="bold">订阅</text><rect x="96" y="274" width="488" height="70" rx="24" fill="#FFEAE1"/><text x="128" y="318">识别候选 → 核实入库</text><text x="96" y="382" font-size="20" fill="#466460">候选不是已订阅；核实后按状态处理。</text><line x1="340" y1="344" x2="340" y2="396" stroke="#D5E5E0" stroke-width="2"/><line x1="200" y1="396" x2="464" y2="396" stroke="#D5E5E0" stroke-width="2"/><line x1="200" y1="396" x2="200" y2="418" stroke="#D5E5E0" stroke-width="2"/><line x1="464" y1="396" x2="464" y2="418" stroke="#D5E5E0" stroke-width="2"/><g id="p15-cancel-choice"><rect x="96" y="418" width="216" height="150" rx="24" fill="#F8FBFA"/><text x="124" y="466" font-size="28" font-weight="bold">取消</text><text x="124" y="516">不等于退款</text></g><g id="p15-renew-choice"><rect x="344" y="418" width="240" height="150" rx="24" fill="#FFEAE1"/><text x="372" y="466" font-size="28" font-weight="bold">本期续费</text><text x="372" y="510">每期单独<tspan x="372" dy="36">强验证</tspan></text></g><text x="96" y="612" font-size="20" fill="#466460">到期提醒保留在站内。</text></g>
<g id="p15-birthday-lane" data-pptx-bounds="664 188 552 454" fill="#183B3A"><rect x="664" y="192" width="552" height="444" rx="24" fill="#FFFFFF" fill-opacity="0.7"/><text x="696" y="242" font-size="28" font-weight="bold">生日</text><line x1="714" y1="282" x2="714" y2="534" stroke="#21605F" stroke-width="2"/><g id="p15-birthday-stages"><circle cx="714" cy="282" r="8" fill="#D8EFFF"/><text x="752" y="292" font-size="28" font-weight="bold">日期计划</text><text x="752" y="328" font-size="20" fill="#466460">登记不是付款</text><circle cx="714" cy="366" r="8" fill="#FFFFD0"/><text x="752" y="376" font-size="28" font-weight="bold">预算预留</text><text x="752" y="412" font-size="20" fill="#466460">预留不是扣款</text><circle cx="714" cy="450" r="8" fill="#FFEAE1"/><text x="752" y="460" font-size="28" font-weight="bold">模拟下单</text><text x="752" y="496" font-size="20" fill="#466460">到期仍需当前授权</text><circle cx="714" cy="534" r="8" fill="#DDFFC2"/><text x="752" y="544" font-size="28" font-weight="bold">释放</text><text x="752" y="580" font-size="20" fill="#466460">失败按既定规则回退</text></g><text x="696" y="618" font-size="20" fill="#21605F">后台准备待办，不批准付款。</text></g>
<g id="p15-footer" data-pptx-role="footer" data-pptx-bounds="64 660 1152 38" font-size="14" fill="#466460"><text x="64" y="688">计划不是永久授权；预留不是扣款；站内通知不代表外部送达。</text><text x="1216" y="688" text-anchor="end">15 / 24</text></g>
</svg>
