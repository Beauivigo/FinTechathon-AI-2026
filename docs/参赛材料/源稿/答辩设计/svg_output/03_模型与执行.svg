<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" data-pptx-page-role="content">
<defs><linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDFFC2" stop-opacity="0.55"/><stop offset="0.48" stop-color="#F8FBFA"/><stop offset="1" stop-color="#EEE1FF" stop-opacity="0.7"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#21605F"/></marker></defs>
<rect id="p03-background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#field)"/>
<g id="p03-heading" data-pptx-bounds="64 34 1152 118" fill="#183B3A"><text x="64" y="56" font-size="14" fill="#466460">01　可信技术 / 职责边界</text><text x="64" y="124" font-size="44" font-weight="bold">模型提出计划，可信程序掌握执行</text></g>
<g id="p03-model-domain" data-pptx-bounds="64 194 500 326" fill="#183B3A"><rect x="64" y="198" width="500" height="316" rx="24" fill="#FFFFFF" fill-opacity="0.74"/><text x="100" y="250" font-size="20" fill="#466460">模型侧 · 提议</text><text x="100" y="314" font-size="28" font-weight="bold">理解　追问　计划</text><text x="100" y="374">输出有界 JSON / DAG，<tspan x="100" dy="36">把自然语言收敛成可校验草稿。</tspan></text><text x="100" y="472" font-size="20" fill="#21605F">模型没有身份、确认和授权证明。</text></g>
<g id="p03-trusted-domain" data-pptx-bounds="716 194 500 326" fill="#183B3A"><rect x="716" y="198" width="500" height="316" rx="24" fill="#FFFFFF" fill-opacity="0.9"/><text x="752" y="250" font-size="20" fill="#466460">可信程序侧 · 校验与执行</text><text x="752" y="314" font-size="28" font-weight="bold">资源　身份　权限</text><text x="752" y="374">校验对象、参数和授权，<tspan x="752" dy="36">由银行网关执行并保留回执。</tspan></text><text x="752" y="472" font-size="20" fill="#21605F">内部资金工具不直接交给模型。</text></g>
<g id="p03-boundary-link" data-pptx-bounds="578 260 124 216" fill="#21605F"><line x1="640" y1="264" x2="640" y2="472" stroke="#D5E5E0" stroke-width="2" stroke-dasharray="6,3"/><line x1="580" y1="370" x2="700" y2="370" stroke="#21605F" stroke-width="2" marker-end="url(#arrow)"/><text x="640" y="338" font-size="20" text-anchor="middle">可信校验</text></g>
<g id="p03-operation-chain" data-pptx-bounds="100 560 1080 76" fill="#183B3A"><line x1="160" y1="590" x2="1120" y2="590" stroke="#D5E5E0" stroke-width="2"/><g id="p03-chain-stations" text-anchor="middle"><rect x="100" y="566" width="120" height="48" rx="24" fill="#DDFFC2"/><text x="160" y="598">意图</text><rect x="340" y="566" width="120" height="48" rx="24" fill="#EEE1FF"/><text x="400" y="598">计划</text><rect x="580" y="566" width="120" height="48" rx="24" fill="#FFFFD0"/><text x="640" y="598">授权</text><rect x="820" y="566" width="120" height="48" rx="24" fill="#D8EFFF"/><text x="880" y="598">执行</text><rect x="1060" y="566" width="120" height="48" rx="24" fill="#FFEAE1"/><text x="1120" y="598">回执</text></g></g>
<g id="p03-footer" data-pptx-role="footer" data-pptx-bounds="64 660 1152 38" font-size="14" fill="#466460"><text x="64" y="688">模型输出是草稿；执行权留在可信程序。</text><text x="1216" y="688" text-anchor="end">03 / 24</text></g>
</svg>
